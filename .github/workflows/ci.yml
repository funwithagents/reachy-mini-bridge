# Continuous integration — specs/testing/ci.md.
#
# Both test tiers on GitHub's hosted runners, on every pull request and push to main,
# six jobs side by side: `check` (lint, format, types) on Linux; `fast-tier` once per
# platform the bridge runs on — Linux, macOS, Windows — since the fast tier needs no
# daemon and no camera and is where a platform's own code paths (the daemon's process
# group and stop, the dependency markers, paths and clocks) meet a machine of that
# platform; and `e2e-sim` (the live tier against the headless sim the harness spawns,
# on Linux, the one platform with a display-less GL backend) once per kinematics engine
# the bridge supports at full accuracy — analytical and placo — since a sim solves every
# target through one engine and the matrix is where the bridge's poses meet Placo's
# limits on every push; the NN engine's own error fails the tracking tests, so it stays
# a local run (specs/testing/testing.md "One engine per run"). None waits on another: a
# run takes as long as its slowest job. Every dependency group installs — on Linux torch comes from
# PyTorch's CPU index, a few seconds — so the real pocket-TTS test runs here too. No
# secret is needed: tests whose needs the runner cannot meet skip, and the spec's
# expected-skips table says which.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Upstream reachy_mini on Linux: PyGObject is sdist-only in the locked range and builds
  # against these headers; GStreamer comes from the system (the introspection data, the
  # base/good/bad plugin sets — Ubuntu 24.04's bad set lacks webrtcdsp, so the daemon
  # runs without software AEC (docs/guides/linux.md) — the PulseAudio plugin). The live job adds PulseAudio itself and Mesa's EGL/OSMesa for the offscreen
  # camera render.
  APT_BASE: >-
    libgirepository1.0-dev libcairo2-dev pkg-config
    gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0
    gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
    gstreamer1.0-pulseaudio gstreamer1.0-tools
  # The live job adds PulseAudio itself, the ICE library the daemon's WebRTC server needs
  # (the Rust webrtc plugin itself has no Ubuntu package: upstream's composite action
  # below installs a prebuilt, checksum-pinned libgstrswebrtc.so), and Mesa's EGL/OSMesa
  # for the offscreen camera render.
  APT_LIVE: >-
    pulseaudio pulseaudio-utils
    gstreamer1.0-nice libnice10
    libegl1 libgl1-mesa-dri libosmesa6

jobs:
  check:
    name: lint, format, types
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::http::Timeout=30 -o Acquire::Retries=3 $APT_BASE
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync (every group, against the lock)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check (code directories only — `ruff format .` reflows Markdown)
        run: uv run ruff format --check src tests tests-e2e examples
      - name: Type check
        run: uv run pyright

  fast-tier:
    name: fast tier (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: ubuntu-24.04, os: ubuntu-24.04}
          - {label: ubuntu-24.04-arm, os: ubuntu-24.04-arm}
          - {label: macos-15, os: macos-15}
          - {label: windows-2025, os: windows-2025}
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::http::Timeout=30 -o Acquire::Retries=3 $APT_BASE
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync (every group, against the lock)
        run: uv sync --locked
      - name: Runner timers (diagnostic)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          sysctl -n hw.ncpu machdep.cpu.brand_string
          uv run python -c "
          import time, statistics as st
          for want in (0.001, 0.005, 0.01, 0.0167):
              got = []
              for _ in range(200):
                  t = time.perf_counter(); time.sleep(want); got.append(time.perf_counter() - t)
              got.sort()
              print(f'sleep {want*1e3:5.1f} ms: median {st.median(got)*1e3:6.2f} p95 {got[189]*1e3:6.2f} max {got[-1]*1e3:6.2f}')
          "
          uv run pytest -n 0 $(cat <<'LIST'
          tests/test_motion.py::test_toggle_during_a_primary_is_deferred
          tests/test_motion.py::test_resume_blends_from_the_present_pose_into_breathing
          tests/test_motion.py::test_leaving_a_custom_idle_move_fades_it_out_to_neutral
          tests/test_motion.py::test_custom_idle_move_plays_in_custom_mode
          tests/test_motion.py::test_an_aim_eases_the_head_onto_it_and_withdrawing_it_eases_it_back
          tests/test_motion.py::test_a_primary_plays_as_recorded_under_an_aim_then_the_head_returns_to_it
          tests/test_motion.py::test_cancelled_future_drops_the_primary_within_a_tick
          tests/test_microphone.py::test_a_lapped_subscriber_reports_one_gap_and_costs_no_one_else
          tests/test_microphone.py::test_preroll_beyond_the_ring_starts_at_the_oldest_chunk
          tests/test_microphone.py::test_mono_and_raw_subscribers_side_by_side_over_the_same_chunks
          tests/test_microphone.py::test_the_fake_capture_is_paced_at_a_hundred_chunks_a_second
          tests/test_camera.py::test_an_empty_read_that_waited_itself_is_not_slowed
          tests/test_camera.py::test_a_reader_failing_for_long_warns_once
          tests/test_bridge.py::test_play_emotion_under_a_tracked_face_plays_as_recorded
          tests/test_bridge.py::test_cancelled_play_emotion_stops_the_sound_and_keeps_the_session
          LIST
          ) -q
      - name: Fast tier
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: uv run pytest

  e2e-sim:
    name: live tier, headless sim (${{ matrix.kinematics }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # One entry per kinematics engine, each on its own runner (two media-on daemons
      # cannot share a host); one engine's failure leaves the other running. NN is
      # left out: its own error fails the tracking tests (specs/testing/testing.md).
      fail-fast: false
      matrix:
        kinematics: [analytical, placo]
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::http::Timeout=30 -o Acquire::Retries=3 $APT_BASE $APT_LIVE
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync (every group, against the lock)
        run: uv sync --locked
      - name: Hugging Face cache (emotions library, YuNet model, pocket-tts weights)
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: hf-${{ runner.os }}-
      - name: Audio device (PulseAudio null sink — the daemon's default source and sink)
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci sink_properties=device.description=ci
          pactl set-default-sink ci
          pactl set-default-source ci.monitor
          pactl info
      # The daemon's media server hard-requires the gst-plugins-rs webrtcsink element, which
      # no Ubuntu archive ships; upstream's own CI installs a prebuilt libgstrswebrtc.so
      # (pinned to a commit and a sha256 inside the action) and puts it on GST_PLUGIN_PATH.
      - name: Rust webrtc plugin (upstream's action, pinned)
        uses: pollen-robotics/reachy_mini/.github/actions/webrtc-plugin@c14dc5fd43100582d349466aec4bdc4960490522
      - name: Live tier
        # The cloud TTS keys, when the repository holds them as secrets: the two cloud
        # `say` tests run; absent (or on a fork's pull request, which never receives a
        # secret) the variables are empty and the tests skip (specs/testing/ci.md).
        # The capabilities this runner is provisioned for: a sim that comes up without
        # its camera (the EGL render), its audio (the null sink) or at all fails the job
        # instead of skipping the files that need them (specs/testing/ci.md).
        env:
          REACHY_MINI_E2E_REQUIRED_CAPS: motion,audio,camera,faces
          # The engine the harness's sim solves through; the tier's engine check fails
          # the entry if the daemon reports another (specs/testing/testing.md).
          REACHY_MINI_E2E_KINEMATICS: ${{ matrix.kinematics }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GRADIUM_API_KEY: ${{ secrets.GRADIUM_API_KEY }}
        # Warnings and errors logged while the tier runs — the spawned daemon's own lines
        # among them, forwarded by the harness — print live, so a daemon that comes up
        # without its camera or its media server says so in the job log.
        run: uv run pytest tests-e2e -rs -o log_cli=true --log-cli-level=WARNING
