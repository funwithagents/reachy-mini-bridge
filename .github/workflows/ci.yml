# Continuous integration — specs/testing/ci.md.
#
# Both test tiers on GitHub's hosted Linux runners, on every pull request and push to
# main, three jobs side by side: `check` (lint, format, types), `fast-tier`, and `e2e-sim`
# (the live tier against the headless sim the harness spawns). None waits on another: a
# run takes as long as its slowest job. Every dependency group installs — on Linux torch comes from
# PyTorch's CPU index, a few seconds — so the real pocket-TTS test runs here too. No
# secret is needed: tests whose needs the runner cannot meet skip, and the spec's
# expected-skips table says which.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Upstream reachy_mini on Linux: PyGObject is sdist-only in the locked range and builds
  # against these headers; GStreamer comes from the system (the introspection data, the
  # base/good/bad plugin sets — bad carries the webrtcdsp software AEC — the PulseAudio
  # plugin). The live job adds PulseAudio itself and Mesa's EGL/OSMesa for the offscreen
  # camera render.
  APT_BASE: >-
    libgirepository1.0-dev libcairo2-dev pkg-config
    gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0
    gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
    gstreamer1.0-pulseaudio gstreamer1.0-tools
  # The live job adds PulseAudio itself, the ICE library the daemon's WebRTC server needs
  # (the Rust webrtc plugin itself has no Ubuntu package: upstream's composite action
  # below installs a prebuilt, checksum-pinned libgstrswebrtc.so), and Mesa's EGL/OSMesa
  # for the offscreen camera render.
  APT_LIVE: >-
    pulseaudio pulseaudio-utils
    gstreamer1.0-nice libnice10
    libegl1 libgl1-mesa-dri libosmesa6

jobs:
  check:
    name: lint, format, types
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_BASE
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync (every group, against the lock)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check (code directories only — `ruff format .` reflows Markdown)
        run: uv run ruff format --check src tests tests-e2e examples
      - name: Type check
        run: uv run pyright

  fast-tier:
    name: fast tier
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_BASE
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync (every group, against the lock)
        run: uv sync --locked
      - name: Fast tier
        run: uv run pytest

  e2e-sim:
    name: live tier, headless sim
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_BASE $APT_LIVE
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync (every group, against the lock)
        run: uv sync --locked
      - name: Hugging Face cache (emotions library, YuNet model, pocket-tts weights)
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: hf-${{ runner.os }}-
      - name: Audio device (PulseAudio null sink — the daemon's default source and sink)
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci sink_properties=device.description=ci
          pactl set-default-sink ci
          pactl set-default-source ci.monitor
          pactl info
      # The daemon's media server hard-requires the gst-plugins-rs webrtcsink element, which
      # no Ubuntu archive ships; upstream's own CI installs a prebuilt libgstrswebrtc.so
      # (pinned to a commit and a sha256 inside the action) and puts it on GST_PLUGIN_PATH.
      - name: Rust webrtc plugin (upstream's action, pinned)
        uses: pollen-robotics/reachy_mini/.github/actions/webrtc-plugin@c14dc5fd43100582d349466aec4bdc4960490522
      - name: Offscreen GL probe (temporary diagnostic)
        run: |
          for gl in egl osmesa; do
            echo "== MUJOCO_GL=$gl"
            MUJOCO_GL=$gl uv run --no-sync python - <<'PY' || true
          import os, mujoco
          m = mujoco.MjModel.from_xml_string('<mujoco><worldbody><light pos="0 0 1"/><camera name="c" pos="0 -1 0.5" xyaxes="1 0 0 0 1 2"/><geom size="0.1"/></worldbody></mujoco>')
          r = mujoco.Renderer(m, 240, 320); d = mujoco.MjData(m); mujoco.mj_forward(m, d); r.update_scene(d, "c"); im = r.render()
          print(os.environ["MUJOCO_GL"], "ok", im.shape, float(im.mean()))
          PY
          done
          echo "== render and detection cost on the test scene"
          for gl in egl osmesa; do
            MUJOCO_GL=$gl uv run --no-sync python - <<'PY' || true
          import os, tempfile, time, numpy as np, mujoco
          from reachy_mini_bridge.testing.sim_scene import write_test_scene, DEFAULT_FACE_POS
          m = mujoco.MjModel.from_xml_path(str(write_test_scene(tempfile.mkdtemp()))); data = mujoco.MjData(m)
          body = mujoco.mj_name2id(m, mujoco.mjtObj.mjOBJ_BODY, "face_1"); data.mocap_pos[m.body_mocapid[body]] = DEFAULT_FACE_POS
          for g in range(m.ngeom):
              if m.geom_bodyid[g] == body: m.geom_rgba[g, 3] = 1.0
          mujoco.mj_forward(m, data); cam = mujoco.mj_name2id(m, mujoco.mjtObj.mjOBJ_CAMERA, "eye_camera")
          print("cpus", os.cpu_count())
          for h, w in ((720, 1280), (360, 640)):
              r = mujoco.Renderer(m, h, w); r.update_scene(data, cam); r.render()
              t = time.perf_counter()
              for _ in range(20): r.update_scene(data, cam); im = r.render()
              print(f"{os.environ['MUJOCO_GL']} render {w}x{h}: {(time.perf_counter()-t)/20*1000:.1f} ms/frame")
          from reachy_mini_bridge.yunet import YuNetDetector
          det = YuNetDetector(); det.detect(im, 0.0)
          t = time.perf_counter()
          for _ in range(10): faces = det.detect(im, 0.0)
          print(f"yunet on a {im.shape[1]}x{im.shape[0]} frame: {(time.perf_counter()-t)/10*1000:.1f} ms, faces {len(faces)}")
          PY
          done
      - name: Live tier
        run: uv run pytest tests-e2e -rs
