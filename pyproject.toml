[project]
name = "reachy-mini-bridge"
version = "0.1.0"
description = "A bridge to the Reachy Mini robot's API plus management/APIs between them, with tools for integrating agents/LLMs."
readme = "README.md"
authors = [
    { name = "Thibault Hervier", email = "thibault@fr2g.io" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "reachy-mini>=1.10",
    # Streaming, stateful resampler for the TTS output path (synth rate -> speaker
    # rate); MIT, wraps BSD-2-Clause libsamplerate, ships prebuilt wheels. Permissive
    # and small, so it sits in the core rather than an extra (see specs/audio.md).
    "samplerate>=0.2",
    # Our first-party streaming TTS engine, the default `say` synthesizer adapter's
    # backend (see specs/audio.md). A base dependency: its own base is numpy plus a
    # sounddevice it imports only for its local player, which the bridge never builds
    # (it injects a robot-speaker sink). The providers are opt-in extras below. Local
    # path dependency during development; a pinned git URL later (specs/project.md).
    "tts-engine",
    # The motion loop catches websockets' ConnectionClosed to tell a lost daemon from a
    # bad tick (specs/motion.md "Lifecycle"). Already resolved through reachy-mini
    # (websockets<16,>=12); declared because the bridge imports it directly.
    "websockets>=12",
]

[project.optional-dependencies]
# The `sim` backend drives the upstream MuJoCo mockup (see specs/robot.md).
sim = ["reachy-mini[mujoco]>=1.10"]
# One extra per tts-engine provider, mapping onto tts-engine's own extras (see
# specs/audio.md): the `tts` block's `module.type` picks the provider, and the matching
# extra installs it. A caller supplying their own SpeechSynthesizer needs neither.
# ElevenLabs: the cloud provider (needs ELEVENLABS_API_KEY); a few MB.
tts-elevenlabs = ["tts-engine[elevenlabs]"]
# pocket-tts: the local model (no key, no network at synthesis time) — pulls torch
# (hundreds of MB) and downloads the model weights on first use.
tts-pocket = ["tts-engine[pocket]"]
# The shipped test harness (`reachy_mini_bridge.testing`, see specs/testing_support.md)
# needs pytest to define its fixtures/skip gates. A downstream project running the e2e
# tier installs `reachy-mini-bridge[test]` (plus `[sim]` for the sim daemon launcher).
test = ["pytest>=9.1.1"]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    # Pull the sim backend into the dev env so the sim e2e tests run (not skip).
    # `sim` stays an optional extra for consumers; only dev installs it by default.
    "reachy-mini-bridge[sim]",
    # Both providers in the dev env: pocket so the real-TTS live test runs with no
    # credential (the cost is torch in every dev sync — accepted, as in tts-engine's
    # own dev group), elevenlabs so the key-gated cloud test can run when a key is
    # set rather than fail on a missing extra. Consumers install one at a time.
    "reachy-mini-bridge[tts-elevenlabs,tts-pocket]",
    # Pull the test extra into the dev env so the shipped harness type-checks and the
    # bridge dogfoods it in tests-e2e/; stays optional for consumers.
    "reachy-mini-bridge[test]",
]
# The Gradio control panel in examples/control_panel (specs/control_panel.md): a
# manual test/demo app, not part of the package. Its own group so a consumer or CI
# can leave it out (`uv sync --no-group demo`); pulled in by default (see
# `default-groups` below) so `uv run pyright` covers examples/ in a normal dev env.
demo = [
    "gradio>=5",
    "reachy-mini-bridge[sim,tts-pocket]",
]

[tool.uv.sources]
# tts-engine is a first-party sibling repo; a local path dependency during
# development (a pinned git URL later, per specs/project.md).
tts-engine = { path = "../tts-engine", editable = true }
# Self-reference for the groups above that pull in the package's own extras.
reachy-mini-bridge = { workspace = true }

[tool.uv]
# Both groups install by default: `demo` is separate so it can be opted out of, not so
# that the verification gate (ruff / pyright over examples/) runs in a partial env.
default-groups = ["dev", "demo"]
# reachy-mini gates PyGObject to Linux (macOS/Windows use the self-contained
# gstreamer-bundle). PyGObject/pycairo are sdist-only in the pinned range, so uv's
# universal lock would try to *build* them on a non-Linux host just to read their
# metadata (needs system cairo) and fail. Declaring their metadata lets uv resolve
# the Linux side of the lock without building them; markers still keep them off
# non-Linux installs.
dependency-metadata = [
    { name = "pygobject", version = "3.46.0", requires-dist = ["pycairo>=1.16.0"] },
    { name = "pycairo", version = "1.29.1" },
]

[tool.ruff]
target-version = "py312"  # keep in sync with requires-python

[tool.pytest.ini_options]
# Only the fast, deterministic tier is collected by default; tests-e2e/ is opt-in.
testpaths = ["tests"]
# Lets tests/ import the example app (`examples.control_panel...`, specs/control_panel.md).
pythonpath = ["."]

[tool.pyright]
include = ["src", "tests", "tests-e2e", "examples"]  # type-check tests and examples too
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
