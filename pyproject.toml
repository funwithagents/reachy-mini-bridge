[project]
name = "reachy-mini-bridge"
version = "0.1.0"
description = "A bridge to the Reachy Mini robot's API plus management/APIs between them, for humans, services and agents/LLMs to drive it."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Thibault Hervier", email = "thibault@fr2g.io" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "reachy-mini>=1.10",
    # Streaming, stateful resampler for the TTS output path (synth rate -> speaker
    # rate); MIT, wraps BSD-2-Clause libsamplerate, ships prebuilt wheels. Permissive
    # and small, so it sits in the core rather than an extra (see specs/audio/audio.md).
    "samplerate>=0.2",
    # Our first-party streaming TTS engine, the default `say` synthesizer adapter's
    # backend (see specs/audio/audio.md). A base dependency: its own base is numpy plus a
    # sounddevice it imports only for its local player, which the bridge never builds
    # (it injects a robot-speaker sink). The providers are opt-in extras below. A
    # direct git reference, so a downstream project inherits the source; tracks main
    # for now, to be pinned to a tag or commit once it settles (specs/project.md). A
    # downstream that wants its own checkout of tts-engine overrides it (see there).
    "tts-engine @ git+https://github.com/funwithagents/tts-engine@main",
    # The motion loop catches websockets' ConnectionClosed to tell a lost daemon from a
    # bad tick (specs/motion/motion.md "Lifecycle"). Already resolved through reachy-mini
    # (websockets<16,>=12); declared because the bridge imports it directly.
    "websockets>=12",
]

[project.urls]
Homepage = "https://github.com/funwithagents/reachy-mini-bridge"
Repository = "https://github.com/funwithagents/reachy-mini-bridge"
Issues = "https://github.com/funwithagents/reachy-mini-bridge/issues"

[project.optional-dependencies]
# The `sim` backend drives the upstream MuJoCo mockup (see specs/core/robot.md). MuJoCo is
# declared here directly, not through `reachy-mini[mujoco]`: that extra is the single
# requirement `mujoco==3.3.0` (February 2025), an exact pin no dependent can loosen, and
# MuJoCo 3.3.1 gave the passive viewer the image/text overlays (`Handle.set_images` /
# `set_texts`) the sim daemon launcher needs to show the camera stream over the viewer
# (specs/daemon/sim_daemon.md). Requiring `mujoco` ourselves keeps the pin out of every
# consumer's graph; `<3.4` stays on patch releases of the version upstream tests on.
# When bumping reachy-mini, check its `mujoco` extra is still only `mujoco`. Upstream
# report: docs/upstream-mujoco-version-pin.md.
sim = ["mujoco>=3.3.1,<3.4"]
# One extra per tts-engine provider, mapping onto tts-engine's own extras (see
# specs/audio/audio.md): the `tts` block's `module.type` picks the provider, and the matching
# extra installs it. A caller supplying their own SpeechSynthesizer needs neither.
# ElevenLabs: the cloud provider (needs ELEVENLABS_API_KEY); a few MB.
tts-elevenlabs = ["tts-engine[elevenlabs]"]
# Gradium: a cloud provider (needs GRADIUM_API_KEY); a few MB.
tts-gradium = ["tts-engine[gradium]"]
# pocket-tts: the local model (no key, no network at synthesis time) — pulls torch
# (hundreds of MB) and downloads the model weights on first use.
tts-pocket = ["tts-engine[pocket]"]
# The shipped test harness (`reachy_mini_bridge.testing`, see specs/testing/testing_support.md)
# needs pytest to define its fixtures/skip gates. A downstream project running the e2e
# tier installs `reachy-mini-bridge[test]` (plus `[sim]` for the sim daemon launcher).
test = ["pytest>=9.1.1"]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    # Pull the sim backend into the dev env so the sim e2e tests run (not skip).
    # `sim` stays an optional extra for consumers; only dev installs it by default.
    "reachy-mini-bridge[sim]",
    # Pull the test extra into the dev env so the shipped harness type-checks and the
    # bridge dogfoods it in tests-e2e/; stays optional for consumers.
    "reachy-mini-bridge[test]",
    "pytest-xdist>=3.8.0",
]
# The TTS providers (specs/project.md "Dependency groups"): pocket so the real-TTS live
# test runs with no credential, elevenlabs and gradium so the key-gated cloud tests run
# when a key is set rather than fail on a missing extra. A default group, so a plain
# `uv sync` has every provider (the cost is torch in every local sync, as in tts-engine's
# own dev group); CI syncs `--no-group tts` (specs/testing/ci.md) and the provider e2e
# tests skip on the missing module. Consumers install one extra at a time. `torch` is
# named here, although pocket-tts brings it, because a uv source applies only to a
# dependency the project declares itself: this is what routes it to the CPU index below.
tts = [
    "reachy-mini-bridge[tts-elevenlabs,tts-gradium,tts-pocket]",
    "torch",
]
# The Gradio control panel in examples/control_panel (specs/examples/control_panel.md): a
# manual test/demo app, not part of the package. Its own group so a consumer can leave
# it out (`uv sync --no-group demo`); pulled in by default (see `default-groups` below)
# so `uv run pyright` covers examples/ in a normal dev env. The panel's voice comes from
# the config's `tts` block, whose provider the `tts` group installs — not from here.
demo = [
    "gradio>=5",
    "reachy-mini-bridge[sim]",
]

[[tool.uv.index]]
# PyPI's Linux torch wheel is the CUDA build and drags gigabytes of NVIDIA libraries no
# machine of ours uses (a CI runner has no GPU, the robot none either); on Linux torch
# resolves from PyTorch's CPU index instead (the `torch` source below). `explicit`: only
# the packages pinned to it below come from here. macOS keeps PyPI's CPU-only wheel.
# A uv source is not inherited by a downstream project, which declares its own if wanted.
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# Self-reference for the groups above that pull in the package's own extras.
reachy-mini-bridge = { workspace = true }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.uv]
# Every group installs by default — a sync is exact, so a group left out of a sync is
# uninstalled by it: `demo` and `tts` are separate so CI (or a consumer) can opt out
# explicitly, not so that a plain dev sync runs the verification gate in a partial env.
default-groups = ["dev", "demo", "tts"]
# reachy-mini gates PyGObject to Linux (macOS/Windows use the self-contained
# gstreamer-bundle). PyGObject/pycairo are sdist-only in the pinned range, so uv's
# universal lock would try to *build* them on a non-Linux host just to read their
# metadata (needs system cairo) and fail. Declaring their metadata lets uv resolve
# the Linux side of the lock without building them; markers still keep them off
# non-Linux installs.
dependency-metadata = [
    { name = "pygobject", version = "3.46.0", requires-dist = ["pycairo>=1.16.0"] },
    { name = "pycairo", version = "1.29.1" },
]

[tool.ruff]
target-version = "py312"  # keep in sync with requires-python

[tool.pytest.ini_options]
# Only the fast, deterministic tier is collected by default; tests-e2e/ is opt-in.
testpaths = ["tests"]
# The fast tier runs in parallel (pytest-xdist): it is sleep-bound — the motion loop and
# the fake run at real time, so most tests wait through real blends and breaths — and
# spread over eight workers its ~3 min of waiting takes ~30 s. Capped at eight: each
# worker is a whole interpreter with the package imported. `-n 0` on the command line
# runs it serially. tests-e2e/conftest.py forces the live tier serial (one shared daemon).
addopts = ["-n", "auto", "--maxprocesses", "8"]
# Lets tests/ import the example app (`examples.control_panel...`, specs/examples/control_panel.md).
pythonpath = ["."]

[tool.pyright]
include = ["src", "tests", "tests-e2e", "examples"]  # type-check tests and examples too
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
