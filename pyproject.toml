[project]
name = "reachy-mini-bridge"
version = "0.1.0"
description = "A bridge to the Reachy Mini robot's API plus management/APIs between them, with tools for integrating agents/LLMs."
readme = "README.md"
authors = [
    { name = "Thibault Hervier", email = "thibault@fr2g.io" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "reachy-mini>=1.10",
    # Streaming, stateful resampler for the TTS output path (synth rate -> speaker
    # rate); MIT, wraps BSD-2-Clause libsamplerate, ships prebuilt wheels. Permissive
    # and small, so it sits in the core rather than an extra (see specs/audio.md).
    "samplerate>=0.2",
]

[project.optional-dependencies]
# The `sim` backend drives the upstream MuJoCo mockup (see specs/client.md).
sim = ["reachy-mini[mujoco]>=1.10"]
# The default `say` synthesizer adapter wraps our first-party tts-engine (see
# specs/audio.md). Optional: a caller supplying their own SpeechSynthesizer needs none
# of it. Local path dependency during development; a pinned git URL later.
tts = ["tts-engine"]
# The shipped test harness (`reachy_mini_bridge.testing`, see specs/testing_support.md)
# needs pytest to define its fixtures/skip gates. A downstream project running the e2e
# tier installs `reachy-mini-bridge[test]` (plus `[sim]` for the sim daemon launcher).
test = ["pytest>=9.1.1"]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    # Pull the sim backend into the dev env so the sim e2e tests run (not skip).
    # `sim` stays an optional extra for consumers; only dev installs it by default.
    "reachy-mini-bridge[sim]",
    # Pull the tts extra into the dev env so the default synthesizer adapter is
    # type-checked and its lazy import is exercised; stays optional for consumers.
    "reachy-mini-bridge[tts]",
    # Pull the test extra into the dev env so the shipped harness type-checks and the
    # bridge dogfoods it in tests-e2e/; stays optional for consumers.
    "reachy-mini-bridge[test]",
]

[tool.uv.sources]
# tts-engine is a first-party sibling repo; a local path dependency during
# development (a pinned git URL later, per specs/project.md).
tts-engine = { path = "../tts-engine", editable = true }

[tool.uv]
# reachy-mini gates PyGObject to Linux (macOS/Windows use the self-contained
# gstreamer-bundle). PyGObject/pycairo are sdist-only in the pinned range, so uv's
# universal lock would try to *build* them on a non-Linux host just to read their
# metadata (needs system cairo) and fail. Declaring their metadata lets uv resolve
# the Linux side of the lock without building them; markers still keep them off
# non-Linux installs.
dependency-metadata = [
    { name = "pygobject", version = "3.46.0", requires-dist = ["pycairo>=1.16.0"] },
    { name = "pycairo", version = "1.29.1" },
]

[tool.ruff]
target-version = "py312"  # keep in sync with requires-python

[tool.pytest.ini_options]
# Only the fast, deterministic tier is collected by default; tests-e2e/ is opt-in.
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests", "tests-e2e"]  # type-check test code too, not just src
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
